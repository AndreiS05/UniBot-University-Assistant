<!DOCTYPE html>
<html lang="ro" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBot · Asistent Virtual — Facultatea de Informatică UVT</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* TEME (variabile CSS)*/
        :root {
            --azure: #1C6DD0;
            --azure-2: #4A9EEA;
            --ink: #0F2A4A;
            --ink-soft: #45607d;
            --bg: #EEF4FB;
            --surface: #FFFFFF;
            --surface-2: #F4F8FD;
            --border: #dce7f4;
            --user-bubble: #1C6DD0;
            --user-text: #ffffff;
            --bot-bubble: #ffffff;
            --bot-text: #16324f;
            --shadow: 0 10px 30px rgba(20, 70, 130, 0.10);
            --shadow-sm: 0 2px 8px rgba(20, 70, 130, 0.08);
            --aura-1: rgba(74, 158, 234, 0.35);
            --aura-2: rgba(28, 109, 208, 0.25);
            --scrollbar: #c3d6ee;
        }

        [data-theme="dark"] {
            --azure: #3B93F0;
            --azure-2: #5aa9f6;
            --ink: #e8f1fb;
            --ink-soft: #9db4d0;
            --bg: #0B1B2E;
            --surface: #12263F;
            --surface-2: #16304f;
            --border: #24405f;
            --user-bubble: #3B93F0;
            --user-text: #06101d;
            --bot-bubble: #16304f;
            --bot-text: #dce9f7;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.30);
            --aura-1: rgba(59, 147, 240, 0.25);
            --aura-2: rgba(28, 80, 160, 0.30);
            --scrollbar: #2b4a70;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: var(--ink);
            background: var(--bg);
            overflow: hidden;
        }

        /* FUNDAL animat cu gradient + aure */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(120deg, var(--bg), var(--surface-2), var(--bg));
            background-size: 300% 300%;
            animation: bgShift 24s ease-in-out infinite;
        }

        .bg-aura {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            pointer-events: none;
        }

        .bg-aura.a1 {
            width: 480px;
            height: 480px;
            background: var(--aura-1);
            top: -120px;
            left: -80px;
            animation: floaty 26s ease-in-out infinite;
        }

        .bg-aura.a2 {
            width: 420px;
            height: 420px;
            background: var(--aura-2);
            bottom: -140px;
            right: -60px;
            animation: floaty 30s ease-in-out infinite reverse;
        }

        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes floaty {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, 30px); }
        }

        /* LAYOUT */
        .app {
            display: grid;
            grid-template-columns: 288px 1fr;
            height: 100vh;
            transition: grid-template-columns .28s ease;
        }

        .app.collapsed {
            grid-template-columns: 0 1fr;
        }

        /* SIDEBAR */
        .sidebar {
            overflow: hidden;
            min-width: 0;
            z-index: 30;
        }

        .sidebar-inner {
            width: 288px;
            height: 100%;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .brand {
            padding: 20px 18px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        .brand-logo svg { width: 46px; height: 46px; }

        .brand-text h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 19px;
            margin: 0;
            line-height: 1.1;
            color: var(--ink);
        }

        .brand-text span {
            font-size: 11.5px;
            color: var(--ink-soft);
        }

        .brand-text .wm-uni { color: var(--ink); }
        .brand-text .wm-bot { color: var(--azure); }

        /* Mascota robot pe ecranul de welcome */
        .mascot {
            display: block;
            margin: 0 auto 16px;
            width: 104px;
            height: auto;
            animation: floatY 4s ease-in-out infinite;
        }

        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-7px); }
        }

        .sidebar-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .btn-new {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px 14px;
            background: linear-gradient(135deg, var(--azure), var(--azure-2));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform .15s, filter .15s;
        }

        .btn-new:hover { filter: brightness(1.06); transform: translateY(-1px); }
        .btn-new:active { transform: translateY(0); }

        .search-box {
            position: relative;
        }

        .search-box svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-soft);
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px 9px 34px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--ink);
            font-size: 13px;
            outline: none;
            transition: border-color .15s;
        }

        .search-box input:focus { border-color: var(--azure); }

        .history-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--ink-soft);
            font-weight: 600;
            padding: 4px 4px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .clear-all {
            border: none;
            background: transparent;
            color: var(--ink-soft);
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            text-transform: none;
            letter-spacing: 0;
            padding: 2px 6px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color .15s, background .15s;
        }

        .clear-all:hover { color: #e5484d; background: color-mix(in srgb, #e5484d 12%, transparent); }
        .clear-all:disabled { opacity: .45; cursor: not-allowed; }

        .history-list {
            list-style: none;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 9px 10px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--bot-text);
            font-size: 13.5px;
            transition: background .15s;
        }

        .history-item:hover { background: var(--surface-2); }
        .history-item.active { background: color-mix(in srgb, var(--azure) 14%, transparent); }

        .history-item .title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item .del {
            opacity: 0;
            border: none;
            background: transparent;
            color: var(--ink-soft);
            cursor: pointer;
            padding: 2px;
            border-radius: 6px;
            display: grid;
            place-items: center;
            transition: opacity .15s, color .15s, background .15s;
        }

        .history-item:hover .del { opacity: 1; }
        .history-item .del:hover { color: #e5484d; background: color-mix(in srgb, #e5484d 12%, transparent); }

        .history-empty {
            font-size: 12.5px;
            color: var(--ink-soft);
            padding: 10px 6px;
            font-style: italic;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border);
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .uvt-tag {
            font-size: 11px;
            color: var(--ink-soft);
            line-height: 1.3;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--ink);
            border-radius: 20px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 500;
            transition: border-color .15s;
        }

        .theme-toggle:hover { border-color: var(--azure); }

        /* ============ ZONA DE CHAT ============ */
        .chat {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            background: color-mix(in srgb, var(--surface) 70%, transparent);
            backdrop-filter: blur(10px);
        }

        .hamburger {
            display: grid;
            place-items: center;
            border: none;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
        }

        .hamburger:hover { background: var(--surface-2); }

        .chat-header .title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 16px;
        }

        .online {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--ink-soft);
            margin-left: auto;
        }

        .online .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 3px color-mix(in srgb, #22c55e 25%, transparent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        .log {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            min-height: 0;
        }

        /* Ecran de bun venit + categorii */
        .welcome {
            max-width: 720px;
            margin: auto;
            width: 100%;
            text-align: center;
            padding: 20px 0;
        }

        .welcome h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 26px;
            margin: 0 0 6px;
            color: var(--ink);
        }

        .welcome p {
            color: var(--ink-soft);
            margin: 0 0 26px;
            font-size: 14.5px;
        }

        .cats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            text-align: left;
        }

        .cat {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            box-shadow: var(--shadow-sm);
        }

        .cat h3 {
            font-size: 13px;
            margin: 0 0 10px;
            color: var(--azure);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .chip {
            display: block;
            width: 100%;
            text-align: left;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 8px 11px;
            margin-bottom: 7px;
            font-size: 12.8px;
            color: var(--bot-text);
            cursor: pointer;
            font-family: inherit;
            transition: background .15s, border-color .15s, transform .1s;
        }

        .chip:last-child { margin-bottom: 0; }
        .chip:hover { border-color: var(--azure); background: color-mix(in srgb, var(--azure) 8%, var(--surface-2)); transform: translateX(2px); }

        /* Mesaje */
        .row {
            display: flex;
            gap: 10px;
            max-width: 760px;
            width: fit-content;
        }

        .row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-size: 15px;
            font-weight: 600;
        }

        .row.bot .avatar {
            background: linear-gradient(135deg, var(--azure), var(--azure-2));
            color: #fff;
        }

        .row.user .avatar {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--ink);
        }

        .bubble-wrap {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .bubble {
            padding: 11px 15px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 14.5px;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: var(--shadow-sm);
        }

        .row.bot .bubble {
            background: var(--bot-bubble);
            color: var(--bot-text);
            border: 1px solid var(--border);
            border-top-left-radius: 4px;
        }

        .row.user .bubble {
            background: var(--user-bubble);
            color: var(--user-text);
            border-top-right-radius: 4px;
        }

        /* Bara de actiuni sub raspunsul botului */
        .actions {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            opacity: 0;
            transition: opacity .15s;
        }

        .row.bot:hover .actions { opacity: 1; }

        .act {
            border: none;
            background: transparent;
            color: var(--ink-soft);
            cursor: pointer;
            padding: 4px 7px;
            border-radius: 7px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background .15s, color .15s;
        }

        .act:hover { background: var(--surface-2); color: var(--azure); }
        .act.done { color: #22c55e; }

        /* Indicator "scrie..." */
        .typing .bubble {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing .bubble span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ink-soft);
            animation: blink 1.3s infinite both;
        }

        .typing .bubble span:nth-child(2) { animation-delay: .2s; }
        .typing .bubble span:nth-child(3) { animation-delay: .4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: .3; transform: scale(.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* Compositor */
        .composer {
            border-top: 1px solid var(--border);
            padding: 14px 24px 18px;
            background: color-mix(in srgb, var(--surface) 70%, transparent);
            backdrop-filter: blur(10px);
        }

        .composer-inner {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 8px 8px 16px;
            box-shadow: var(--shadow-sm);
            transition: border-color .15s;
        }

        .composer-inner:focus-within { border-color: var(--azure); }

        .composer textarea {
            flex: 1;
            border: none;
            background: transparent;
            resize: none;
            outline: none;
            font-family: inherit;
            font-size: 14.5px;
            color: var(--ink);
            line-height: 1.5;
            max-height: 140px;
            padding: 6px 0;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--azure), var(--azure-2));
            color: #fff;
            cursor: pointer;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            transition: filter .15s, transform .1s;
        }

        .send-btn:hover { filter: brightness(1.08); }
        .send-btn:active { transform: scale(.94); }
        .send-btn:disabled { opacity: .5; cursor: not-allowed; }

        .composer-hint {
            max-width: 820px;
            margin: 8px auto 0;
            font-size: 11px;
            color: var(--ink-soft);
            text-align: center;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--ink);
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 100;
        }

        [data-theme="dark"] .toast { background: var(--surface-2); border: 1px solid var(--border); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Scrim (mobil) */
        .scrim {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(6, 20, 40, 0.45);
            z-index: 25;
            opacity: 0;
            transition: opacity .2s;
        }

        .scrim.show { opacity: 1; }

        /* Scrollbar */
        .log::-webkit-scrollbar, .history-list::-webkit-scrollbar { width: 8px; }
        .log::-webkit-scrollbar-thumb, .history-list::-webkit-scrollbar-thumb {
            background: var(--scrollbar); border-radius: 8px;
        }

        /* RESPONSIVE */
        @media (max-width: 860px) {
            .app, .app.collapsed { grid-template-columns: 1fr; }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 288px;
                transform: translateX(-100%);
                transition: transform .25s ease;
                box-shadow: var(--shadow);
            }
            .sidebar.open { transform: translateX(0); }
        }

        /* Accesibilitate: reduce motion */
        @media (prefers-reduced-motion: reduce) {
            .bg-layer, .bg-aura, .online .dot, .mascot { animation: none; }
            * { transition: none !important; }
        }

        :focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
    </style>
</head>

<body>
    <div class="bg-layer"></div>
    <div class="bg-aura a1"></div>
    <div class="bg-aura a2"></div>

    <div class="app">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-inner">
            <div class="brand">
                <div class="brand-logo" aria-hidden="true">
                    <svg viewBox="0 0 88 92" xmlns="http://www.w3.org/2000/svg">
                        <rect x="12" y="38" width="64" height="40" rx="14" fill="var(--azure)"/>
                        <path d="M28 76 L22 88 L40 76 Z" fill="var(--azure)"/>
                        <circle cx="32" cy="58" r="4.2" fill="#fff"/>
                        <circle cx="44" cy="58" r="4.2" fill="#fff"/>
                        <circle cx="56" cy="58" r="4.2" fill="#fff"/>
                        <polygon points="44,12 74,26 44,40 14,26" fill="var(--ink)"/>
                        <path d="M44 40 L44 34 L62 25 L62 32 Z" fill="var(--ink)"/>
                        <line x1="72" y1="26" x2="72" y2="44" stroke="var(--ink)" stroke-width="2.5"/>
                        <circle cx="72" cy="46" r="3.5" fill="var(--azure-2)"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1><span class="wm-uni">Uni</span><span class="wm-bot">Bot</span></h1>
                    <span>Facultatea de Informatică · UVT</span>
                </div>
            </div>

            <div class="sidebar-body">
                <button class="btn-new" id="btnNew">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    Conversație nouă
                </button>

                <div class="search-box">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="search" placeholder="Caută în istoric…" aria-label="Caută în istoric">
                </div>

                <div class="history-label">
                    <span>Istoric</span>
                    <button class="clear-all" id="clearAll" title="Șterge tot istoricul">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                        Golește
                    </button>
                </div>
                <ul class="history-list" id="historyList"></ul>
            </div>

            <div class="sidebar-footer">
                <div class="uvt-tag">Universitatea de Vest<br>din Timișoara</div>
                <button class="theme-toggle" id="themeToggle" aria-label="Comută tema">
                    <span id="themeIcon">🌙</span><span id="themeLabel">Dark</span>
                </button>
            </div>
          </div>
        </aside>

        <div class="scrim" id="scrim"></div>

        <!-- CHAT -->
        <main class="chat">
            <header class="chat-header">
                <button class="hamburger" id="hamburger" aria-label="Meniu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                </button>
                <span class="title">UniBot · Asistent Virtual</span>
                <span class="online"><span class="dot"></span>online</span>
            </header>

            <div class="log" id="log" aria-live="polite" aria-label="Conversație"></div>

            <div class="composer">
                <div class="composer-inner">
                    <textarea id="input" rows="1" placeholder="Scrie o întrebare despre facultate…" aria-label="Mesaj"></textarea>
                    <button class="send-btn" id="send" aria-label="Trimite">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
                <div class="composer-hint">UniBot poate greși. Verifică informațiile importante pe site-ul oficial UVT.</div>
            </div>
        </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // CONFIG
        // Fiecare categorie are un "pool" de intrebari; la fiecare conversatie noua
        // se aleg 3 la intamplare, ca sectiunea de sugestii sa fie mereu diferita.
        const CATEGORIES = [
            {
                title: "📚 Materii & credite",
                pool: [
                    "Câte credite are Baze de date?",
                    "Cine predă Inteligență artificială?",
                    "Cum se promovează la Programare I?",
                    "În ce an se studiază Rețele de calculatoare?",
                    "Câte credite are Algebră liniară?",
                    "Cine predă Sisteme de operare I?",
                    "Ce fel de disciplină este Programare logică și funcțională?"
                ]
            },
            {
                title: "🎓 Admitere & taxe",
                pool: [
                    "Cum se intră la Informatică?",
                    "Ce medie îmi trebuie la admitere?",
                    "Ce acte îmi trebuie la înscriere?",
                    "Cât e taxa de școlarizare?",
                    "Când e admiterea?",
                    "Câte locuri sunt la Informatică?"
                ]
            },
            {
                title: "🏛️ Facultate & resurse",
                pool: [
                    "Cum promovez facultatea?",
                    "Cum se dă examenul de licență?",
                    "Când e sesiunea de vară?",
                    "Ce resurse am ca student?",
                    "Ce sunt disciplinele complementare?",
                    "Când e vacanța de iarnă?"
                ]
            }
        ];

        // Alege n elemente la intamplare dintr-un tablou
        function pickRandom(arr, n) {
            return [...arr].sort(() => Math.random() - 0.5).slice(0, n);
        }

        const STORE_THEME = 'unibot-theme';

        // STARE 
        // Conversatiile sunt stocate pe server (SQLite), pe sesiune anonima (cookie).
        // Aici pastram doar metadatele (id + titlu); mesajele se aduc la deschidere.
        let conversations = [];
        let activeId = null;

        // ELEMENTE
        const $ = id => document.getElementById(id);
        const log = $('log'), input = $('input'), historyList = $('historyList');

        // TEMA
        function initTheme() {
            let t = localStorage.getItem(STORE_THEME);
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            applyTheme(t);
        }
        function applyTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem(STORE_THEME, t);
            // Butonul arata MODUL ACTIV in acest moment (starea curenta)
            $('themeIcon').textContent = t === 'dark' ? '🌙' : '☀️';
            $('themeLabel').textContent = t === 'dark' ? 'Dark' : 'Light';
        }
        $('themeToggle').onclick = () => {
            const cur = document.documentElement.getAttribute('data-theme');
            applyTheme(cur === 'dark' ? 'light' : 'dark');
        };

        // STOCARE (server)
        async function loadConversations() {
            try {
                const res = await fetch('/conversatii');
                conversations = await res.json();
            } catch { conversations = []; }
            renderHistory();
        }

        // CONVERSATII (server)
        function newConversation() {
            activeId = null;
            renderHistory();
            renderWelcome();
            closeSidebarMobile();
            input.focus();
        }

        async function openConversation(id) {
            activeId = id;
            renderHistory();
            try {
                const res = await fetch('/conversatii/' + id);
                const data = await res.json();
                log.innerHTML = '';
                (data.mesaje || []).forEach(m => appendMessage(m.rol, m.text, false));
                scrollBottom();
            } catch { renderWelcome(); }
            closeSidebarMobile();
        }

        async function deleteConversation(id, ev) {
            ev.stopPropagation();
            try { await fetch('/conversatii/' + id, { method: 'DELETE' }); } catch {}
            conversations = conversations.filter(c => c.id !== id);
            if (activeId === id) { activeId = null; renderWelcome(); }
            renderHistory();
        }

        // RANDARE ISTORIC
        function renderHistory() {
            const q = $('search').value.trim().toLowerCase();
            const filtered = conversations.filter(c => !q || (c.titlu || '').toLowerCase().includes(q));

            historyList.innerHTML = '';
            if (filtered.length === 0) {
                historyList.innerHTML = `<li class="history-empty">${q ? 'Niciun rezultat.' : 'Nicio conversație încă.'}</li>`;
                return;
            }
            filtered.forEach(c => {
                const li = document.createElement('li');
                li.className = 'history-item' + (c.id === activeId ? ' active' : '');
                li.onclick = () => openConversation(c.id);
                li.innerHTML = `
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span class="title"></span>
                    <button class="del" aria-label="Șterge conversația">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                    </button>`;
                li.querySelector('.title').textContent = c.titlu;
                li.querySelector('.del').onclick = (e) => deleteConversation(c.id, e);
                historyList.appendChild(li);
            });
        }

        // RANDARE MESAJE
        function renderWelcome() {
            const cats = CATEGORIES.map(cat => `
                <div class="cat">
                    <h3>${cat.title}</h3>
                    ${pickRandom(cat.pool, 3).map(q => `<button class="chip">${q}</button>`).join('')}
                </div>`).join('');
            log.innerHTML = `
                <div class="welcome">
                    <svg class="mascot" viewBox="0 0 110 132" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                        <line x1="55" y1="10" x2="55" y2="22" stroke="var(--azure)" stroke-width="3.5" stroke-linecap="round"/>
                        <circle cx="55" cy="9" r="5" fill="var(--azure-2)"/>
                        <rect x="22" y="22" width="66" height="52" rx="18" fill="var(--azure)"/>
                        <rect x="31" y="33" width="48" height="30" rx="12" fill="#0a1a2e" stroke="rgba(255,255,255,.20)" stroke-width="1"/>
                        <circle cx="46" cy="47" r="6" fill="#bfe6ff"/>
                        <circle cx="64" cy="47" r="6" fill="#bfe6ff"/>
                        <circle cx="47.4" cy="45.6" r="2.1" fill="#ffffff"/>
                        <circle cx="65.4" cy="45.6" r="2.1" fill="#ffffff"/>
                        <path d="M45 57 Q55 63 65 57" stroke="#bfe6ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                        <rect x="34" y="80" width="42" height="34" rx="12" fill="var(--azure)"/>
                        <rect x="47" y="88" width="16" height="12" rx="3" fill="#0a1a2e" stroke="rgba(255,255,255,.16)" stroke-width="1"/>
                        <path d="M34 96 Q18 90 20 74" stroke="var(--azure)" stroke-width="6" fill="none" stroke-linecap="round"/>
                        <circle cx="20" cy="72" r="6" fill="var(--azure-2)"/>
                        <path d="M76 100 Q92 96 92 84" stroke="var(--azure)" stroke-width="6" fill="none" stroke-linecap="round"/>
                        <circle cx="92" cy="82" r="6" fill="var(--azure-2)"/>
                    </svg>
                    <h2>Bună! Sunt UniBot 👋</h2>
                    <p>Asistentul virtual al Facultății de Informatică UVT. Întreabă-mă despre materii, credite, cadre didactice, admitere, taxe sau resurse.</p>
                    <div class="cats">${cats}</div>
                </div>`;
            log.querySelectorAll('.chip').forEach(ch => {
                ch.onclick = () => { input.value = ch.textContent; sendMessage(); };
            });
        }

        function appendMessage(role, text, animate = true) {
            const row = document.createElement('div');
            row.className = 'row ' + role;
            const avatar = role === 'bot' ? 'U' : '🙂';
            row.innerHTML = `
                <div class="avatar">${avatar}</div>
                <div class="bubble-wrap">
                    <div class="bubble"></div>
                </div>`;
            row.querySelector('.bubble').textContent = text;

            if (role === 'bot') {
                const actions = document.createElement('div');
                actions.className = 'actions';
                actions.innerHTML = `
                    <button class="act" data-a="copy" title="Copiază">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copiază
                    </button>
                    <button class="act" data-a="up" title="Răspuns util">👍</button>
                    <button class="act" data-a="down" title="Răspuns neutil">👎</button>`;
                row.querySelector('.bubble-wrap').appendChild(actions);
                actions.querySelector('[data-a=copy]').onclick = (e) => copyText(text, e.currentTarget);
                actions.querySelector('[data-a=up]').onclick = (e) => feedback(e.currentTarget, 'up');
                actions.querySelector('[data-a=down]').onclick = (e) => feedback(e.currentTarget, 'down');
            }
            log.appendChild(row);
            if (animate) scrollBottom();
            return row;
        }

        function showTyping() {
            const row = document.createElement('div');
            row.className = 'row bot typing';
            row.id = 'typing';
            row.innerHTML = `<div class="avatar">U</div><div class="bubble-wrap"><div class="bubble"><span></span><span></span><span></span></div></div>`;
            log.appendChild(row);
            scrollBottom();
        }
        function hideTyping() { const t = $('typing'); if (t) t.remove(); }

        function scrollBottom() { log.scrollTop = log.scrollHeight; }

        // TRIMITERE MESAJ 
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // daca era ecranul de welcome, curatam
            if (log.querySelector('.welcome')) log.innerHTML = '';

            appendMessage('user', text);
            input.value = '';
            autoGrow();

            $('send').disabled = true;
            showTyping();

            try {
                const res = await fetch('/get_response', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, conversatie_id: activeId })
                });
                const data = await res.json();
                hideTyping();
                appendMessage('bot', data.reply || 'Nu am primit un răspuns.');
                // Actualizam conversatia activa + lista din istoric (server-authoritative)
                if (data.conversatie_id) {
                    activeId = data.conversatie_id;
                    const idx = conversations.findIndex(c => c.id === activeId);
                    if (idx === -1) {
                        conversations.unshift({ id: activeId, titlu: data.titlu });
                    } else {
                        const [c] = conversations.splice(idx, 1);
                        conversations.unshift(c);
                    }
                    renderHistory();
                }
            } catch (err) {
                hideTyping();
                appendMessage('bot', 'Nu pot contacta serverul. Pornește aplicația Flask (python app.py) și încearcă din nou.');
            } finally {
                $('send').disabled = false;
                input.focus();
            }
        }

        // ACTIUNI RASPUNS
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.classList.add('done');
                showToast('Răspuns copiat ✓');
                setTimeout(() => btn.classList.remove('done'), 1500);
            });
        }
        function feedback(btn, type) {
            const parent = btn.parentElement;
            parent.querySelectorAll('[data-a=up],[data-a=down]').forEach(b => b.classList.remove('done'));
            btn.classList.add('done');
            showToast(type === 'up' ? 'Mulțumesc pentru feedback! 👍' : 'Feedback notat, vom îmbunătăți. 👎');
        }

        // TOAST
        let toastTimer;
        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        // COMPOSITOR
        function autoGrow() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 140) + 'px';
        }
        input.addEventListener('input', autoGrow);
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
        $('send').onclick = sendMessage;

        // CAUTARE + BUTOANE 
        $('search').addEventListener('input', renderHistory);
        $('btnNew').onclick = newConversation;

        // Sterge tot istoricul sesiunii curente (dupa confirmare)
        $('clearAll').onclick = async () => {
            if (!conversations.length) { showToast('Istoricul e deja gol.'); return; }
            if (!confirm('Ștergi tot istoricul conversațiilor? Acțiunea nu poate fi anulată.')) return;
            try { await fetch('/conversatii', { method: 'DELETE' }); } catch {}
            conversations = [];
            activeId = null;
            renderHistory();
            renderWelcome();
            showToast('Istoricul a fost șters.');
        };

        // SIDEBAR MOBIL 
        function openSidebarMobile() { $('sidebar').classList.add('open'); $('scrim').style.display = 'block'; requestAnimationFrame(() => $('scrim').classList.add('show')); }
        function closeSidebarMobile() { $('sidebar').classList.remove('open'); $('scrim').classList.remove('show'); setTimeout(() => $('scrim').style.display = 'none', 200); }

        function toggleSidebar() {
            if (window.matchMedia('(max-width: 860px)').matches) {
                // Mobil: drawer glisant (deschide/inchide)
                if ($('sidebar').classList.contains('open')) closeSidebarMobile();
                else openSidebarMobile();
            } else {
                // Desktop: plieaza/afiseaza sidebar-ul (ramane lipit stanga cand e deschis)
                const app = document.querySelector('.app');
                app.classList.toggle('collapsed');
                localStorage.setItem('unibot-sidebar', app.classList.contains('collapsed') ? 'collapsed' : 'open');
            }
        }
        $('hamburger').onclick = toggleSidebar;
        $('scrim').onclick = closeSidebarMobile;

        // INIT 
        initTheme();
        // Restaureaza starea sidebar-ului (doar pe desktop)
        if (localStorage.getItem('unibot-sidebar') === 'collapsed' && window.matchMedia('(min-width: 861px)').matches) {
            document.querySelector('.app').classList.add('collapsed');
        }
        loadConversations();
        renderWelcome();
        input.focus();
    </script>
</body>

</html>
